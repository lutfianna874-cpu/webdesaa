<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Desa Sepinggan Gelik</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dfeee8, #f8f5ec);
        }

        .login-container {
            width: 90%;
            max-width: 620px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 50px 48px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            color: #111827;
        }

        .subtitle {
            font-size: 24px;
            margin-top: 10px;
            margin-bottom: 40px;
            color: #374151;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111827;
        }

        input {
            width: 100%;
            padding: 18px;
            border: 2px solid #b8c8d8;
            border-radius: 15px;
            font-size: 20px;
            outline: none;
        }

        input:focus {
            border-color: #397d68;
        }

        .login-button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: #397d68;
            color: white;
            font-size: 23px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #2f6857;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            font-size: 17px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: #fce7eb;
            color: #8b3040;
        }

        .success {
            display: block;
            background: #dff5e9;
            color: #21623e;
        }

        .back {
            display: block;
            margin-top: 30px;
            color: #607d8b;
            text-decoration: none;
            font-size: 19px;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .login-box {
                padding: 35px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 19px;
            }

            label {
                font-size: 18px;
            }

            input {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="icon">🔐</div>

        <h1>LOGIN ADMIN</h1>

        <div class="subtitle">
            Desa Sepinggan Gelik
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                🔑 MASUK
            </button>

        </form>

        <div id="message" class="message"></div>

        <a href="index.html" class="back">
            ← Kembali ke Beranda
        </a>

    </div>

</div>

<script src="config.js"></script>

<script>

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    let timeoutLogin = null;


    function showMessage(text, type) {

        message.textContent = text;

        message.className = "message " + type;
    }


    function loginBerhasil(data) {

        clearTimeout(timeoutLogin);

        loginButton.disabled = false;
        loginButton.textContent = "🔑 MASUK";

        if (data && data.success === true && data.token) {

            sessionStorage.setItem(
                "desaAdminToken",
                data.token
            );

            showMessage(
                "Login berhasil. Mengarahkan ke dashboard...",
                "success"
            );

            setTimeout(function () {

                window.location.href = "admin.html";

            }, 700);

        } else {

            showMessage(
                data && data.message
                    ? data.message
                    : "Username atau password salah.",
                "error"
            );
        }
    }


    function loginGagal() {

        clearTimeout(timeoutLogin);

        loginButton.disabled = false;
        loginButton.textContent = "🔑 MASUK";

        showMessage(
            "Tidak dapat terhubung ke database. Silakan coba lagi.",
            "error"
        );
    }


    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        if (!username || !password) {

            showMessage(
                "Username dan password wajib diisi.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;
        loginButton.textContent = "⏳ MEMERIKSA...";

        message.className = "message";
        message.textContent = "";


        /*
         * JSONP
         * Digunakan agar GitHub Pages dapat
         * berkomunikasi dengan Google Apps Script
         * tanpa masalah CORS.
         */

        const callbackName =
            "desaLoginCallback_" + Date.now();


        window[callbackName] = function(data) {

            loginBerhasil(data);

            try {
                delete window[callbackName];
            } catch (e) {}

            const script =
                document.getElementById(callbackName);

            if (script) {
                script.remove();
            }
        };


        const script =
            document.createElement("script");

        script.id = callbackName;

        const url =
            WEB_APP_URL +
            "?action=login" +
            "&username=" +
            encodeURIComponent(username) +
            "&password=" +
            encodeURIComponent(password) +
            "&callback=" +
            encodeURIComponent(callbackName);


        script.src = url;


        script.onerror = function() {

            loginGagal();

            try {
                delete window[callbackName];
            } catch (e) {}

            script.remove();
        };


        document.body.appendChild(script);


        /*
         * Jika terlalu lama tidak mendapat jawaban,
         * tampilkan pesan koneksi.
         */

        timeoutLogin = setTimeout(function() {

            if (window[callbackName]) {

                loginGagal();

                try {
                    delete window[callbackName];
                } catch (e) {}

                script.remove();
            }

        }, 15000);

    });

</script>

</body>
</html>
