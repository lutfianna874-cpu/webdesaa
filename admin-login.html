<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login Admin - Desa Sepinggan Gelik
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #365b3a,
                    #557c58
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-box {

            width: 100%;

            max-width: 520px;

            background: white;

            border-radius: 28px;

            padding: 45px 40px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.20);

        }


        .logo {

            text-align: center;

            font-size: 75px;

            margin-bottom: 25px;

        }


        h1 {

            text-align: center;

            margin: 0;

            color: #365b3a;

            font-size: 40px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 23px;

            margin-top: 15px;

            margin-bottom: 40px;

        }


        .error {

            display: none;

            background: #fde0e0;

            color: #a52323;

            padding: 17px;

            border-radius: 15px;

            text-align: center;

            margin-bottom: 25px;

            font-size: 17px;

        }


        .form-group {

            margin-bottom: 25px;

        }


        label {

            display: block;

            color: #365b3a;

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        input {

            width: 100%;

            padding: 19px;

            border-radius: 15px;

            border: 2px solid #d0d0d0;

            font-size: 20px;

            outline: none;

        }


        input:focus {

            border-color: #557c58;

        }


        button {

            width: 100%;

            border: none;

            padding: 20px;

            border-radius: 16px;

            background: #294d2d;

            color: white;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: .6;

            cursor: wait;

        }


        .back {

            display: block;

            width: 100%;

            text-align: center;

            text-decoration: none;

            margin-top: 20px;

            padding: 20px;

            border-radius: 16px;

            background: #eeeeee;

            color: #365b3a;

            font-size: 20px;

            font-weight: bold;

        }


        .footer {

            text-align: center;

            margin-top: 35px;

            color: #888;

            font-size: 17px;

        }


        @media (max-width: 600px) {

            .login-box {

                padding: 35px 25px;

                border-radius: 25px;

            }


            .logo {

                font-size: 60px;

            }


            h1 {

                font-size: 34px;

            }


            .subtitle {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <div class="logo">
            🌾
        </div>


        <h1>
            LOGIN ADMIN
        </h1>


        <div class="subtitle">
            Desa Sepinggan Gelik
        </div>


        <div
            id="errorMessage"
            class="error">
        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    placeholder="Masukkan username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    placeholder="Masukkan password"
                    required>

            </div>


            <button
                type="submit"
                id="loginButton">

                🔐 MASUK

            </button>


        </form>


        <a
            href="index.html"
            class="back">

            🏠 KEMBALI KE BERANDA

        </a>


        <div class="footer">

            Sistem Admin Desa Sepinggan Gelik

        </div>


    </div>


    <script src="config.js"></script>


    <script>


        /* =================================================
           URL DATABASE
        ================================================= */

        const WEB_URL =
            typeof WEB_APP_URL !== "undefined"
                ? WEB_APP_URL
                : "";


        /* =================================================
           ELEMENT
        ================================================= */

        const form =
            document.getElementById(
                "loginForm"
            );


        const button =
            document.getElementById(
                "loginButton"
            );


        const errorBox =
            document.getElementById(
                "errorMessage"
            );


        /* =================================================
           LOGIN
        ================================================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                errorBox.style.display =
                    "none";


                const username =
                    document
                        .getElementById(
                            "username"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                if (!WEB_URL) {

                    showError(
                        "URL database belum ditemukan. Periksa config.js."
                    );

                    return;

                }


                button.disabled =
                    true;


                button.textContent =
                    "⏳ MEMERIKSA...";


                try {


                    /*
                     * LOGIN MENGGUNAKAN GET
                     * agar tidak terkena masalah
                     * POST/404 sebelumnya.
                     */

                    const url =
                        WEB_URL +
                        "?action=login" +
                        "&username=" +
                        encodeURIComponent(
                            username
                        ) +
                        "&password=" +
                        encodeURIComponent(
                            password
                        );


                    const response =
                        await fetch(url);


                    if (!response.ok) {

                        throw new Error(
                            "Server error: HTTP " +
                            response.status
                        );

                    }


                    const result =
                        await response.json();


                    if (
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "Username atau password salah."
                        );

                    }


                    /*
                     * SIMPAN TOKEN
                     */

                    sessionStorage.setItem(
                        "desaAdminToken",
                        result.token
                    );


                    sessionStorage.setItem(
                        "desaAdminLogin",
                        "true"
                    );


                    /*
                     * MASUK DASHBOARD
                     */

                    window.location.href =
                        "admin.html";

                }


                catch (error) {

                    console.error(
                        error
                    );


                    showError(
                        error.message
                    );


                    button.disabled =
                        false;


                    button.textContent =
                        "🔐 MASUK";

                }

            }
        );


        /* =================================================
           ERROR
        ================================================= */

        function showError(message) {

            errorBox.textContent =
                message;


            errorBox.style.display =
                "block";

        }


    </script>


</body>

</html>
