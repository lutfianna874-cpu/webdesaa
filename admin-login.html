<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin | Desa Sepinggan Gelik</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dfead8, #f7f3df);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.96);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .login-box h1 {
            margin: 5px 0;
            color: #315b35;
        }

        .login-box p {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #315b35;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #5d8c61;
        }

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #4f7d52;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #3f6842;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-button {
            display: block;
            margin-top: 15px;
            color: #4f7d52;
            text-decoration: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #a00000;
        }

        .message.success {
            display: block;
            background: #e2f5e4;
            color: #246b2a;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-icon">
            🔐
        </div>

        <h1>LOGIN ADMIN</h1>

        <p>
            Desa Sepinggan Gelik
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                🔑 MASUK
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <a
            href="index.html"
            class="back-button"
        >
            ← Kembali ke Beranda
        </a>

    </div>

</div>

<script src="config.js"></script>

<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;
}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (!username || !password) {

        showMessage(
            "Username dan password wajib diisi.",
            "error"
        );

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "⏳ MEMERIKSA...";

    showMessage(
        "Sedang memeriksa login...",
        "success"
    );

    try {

        const formData = new URLSearchParams();

        formData.append("action", "login");
        formData.append("username", username);
        formData.append("password", password);

        const response = await fetch(WEB_APP_URL, {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
            },

            body: formData.toString()

        });

        if (!response.ok) {

            throw new Error(
                "Server mengembalikan status " +
                response.status
            );
        }

        const result = await response.json();

        console.log("HASIL LOGIN:", result);

        if (result.success === true && result.token) {

            sessionStorage.setItem(
                "desaAdminToken",
                result.token
            );

            sessionStorage.setItem(
                "desaAdminLogin",
                username
            );

            showMessage(
                "Login berhasil. Membuka dashboard...",
                "success"
            );

            setTimeout(function() {

                window.location.href = "admin.html";

            }, 500);

        } else {

            showMessage(
                result.message ||
                "Username atau password salah.",
                "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "🔑 MASUK";
        }

    } catch (error) {

        console.error("LOGIN ERROR:", error);

        showMessage(
            "Tidak dapat terhubung ke database. Pastikan URL Apps Script dan deployment sudah benar.",
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "🔑 MASUK";
    }

});

</script>

</body>
</html>
