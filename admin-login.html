<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin | Desa Sepinggan Gelik</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #315b35, #6d9365);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .login-logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        .login-card h1 {
            text-align: center;
            margin: 0;
            color: #315b35;
            font-size: 25px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #315b35;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #315b35;
        }

        .login-button,
        .home-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            text-align: center;
        }

        .login-button {
            background: #315b35;
            color: white;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #24472a;
        }

        .home-button {
            background: #eeeeee;
            color: #315b35;
            text-decoration: none;
            margin-top: 10px;
        }

        .home-button:hover {
            background: #dddddd;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            display: block;
            background: #ffe1e1;
            color: #a00000;
        }

        .message.success {
            display: block;
            background: #e1f4e3;
            color: #246b2a;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            🌾
        </div>

        <h1>
            LOGIN ADMIN
        </h1>

        <p class="subtitle">
            Desa Sepinggan Gelik
        </p>

        <div
            id="message"
            class="message">
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button">
                🔐 MASUK
            </button>

        </form>


        <a
            href="index.html"
            class="home-button">
            🏠 KEMBALI KE BERANDA
        </a>


        <div class="login-footer">
            Sistem Admin Desa Sepinggan Gelik
        </div>

    </div>

</div>


<script src="config.js"></script>

<script>

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


const WEB_URL =
    typeof WEB_APP_URL !== "undefined"
        ? WEB_APP_URL
        : "";


/* =========================================
   PESAN
========================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!WEB_URL) {

            showMessage(
                "URL database belum terhubung.",
                "error"
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "⏳ MEMERIKSA...";


        try {

            const formData =
                new URLSearchParams();

            formData.append(
                "action",
                "login"
            );

            formData.append(
                "username",
                username
            );

            formData.append(
                "password",
                password
            );


            const response =
                await fetch(
                    WEB_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server error: HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            if (!result.success) {

                throw new Error(
                    result.message ||
                    "Username atau password salah."
                );

            }


            sessionStorage.setItem(
                "desaAdminToken",
                result.token
            );


            sessionStorage.setItem(
                "desaAdminLogin",
                username
            );


            showMessage(
                "Login berhasil. Membuka dashboard...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                500
            );


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Login gagal. Periksa koneksi database.",
                "error"
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 MASUK";

        }

    }
);

</script>

</body>
</html>
