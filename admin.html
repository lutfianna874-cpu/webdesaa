<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard Admin | Desa Sepinggan Gelik</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6ef;
        }

        .admin-header {
            background: #315b35;
            color: white;
            padding: 20px;
        }

        .admin-header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-button {
            border: none;
            background: #ffffff;
            color: #315b35;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .admin-card h2 {
            margin-top: 0;
            color: #315b35;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #315b35;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .save-button,
        .cancel-button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-button {
            background: #4f7d52;
            color: white;
        }

        .cancel-button {
            background: #ddd;
            color: #333;
        }

        .data-item {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .data-item h3 {
            margin-top: 0;
            color: #315b35;
        }

        .data-category {
            display: inline-block;
            background: #dcebdc;
            color: #315b35;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .data-image {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            margin-top: 10px;
            object-fit: cover;
        }

        .data-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-button,
        .delete-button {
            border: none;
            padding: 8px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-button {
            background: #e7c95b;
        }

        .delete-button {
            background: #d9534f;
            color: white;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .message.success {
            display: block;
            background: #e0f3e2;
            color: #246b2a;
        }

        .message.error {
            display: block;
            background: #ffe1e1;
            color: #9b0000;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 700px) {

            .admin-header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

<header class="admin-header">

    <div class="admin-header-inner">

        <h1>
            🌾 DASHBOARD ADMIN
        </h1>

        <button
            class="logout-button"
            id="logoutButton"
        >
            🚪 Logout
        </button>

    </div>

</header>


<main class="admin-container">

    <div
        id="message"
        class="message"
    ></div>


    <!-- FORM DATA -->

    <section class="admin-card">

        <h2 id="formTitle">
            ➕ Tambah Data Desa
        </h2>

        <form id="dataForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="nama">
                        Nama Pengisi
                    </label>

                    <input
                        type="text"
                        id="nama"
                        required
                        placeholder="Contoh: Lutfiyana"
                    >

                </div>


                <div class="form-group">

                    <label for="judul">
                        Judul
                    </label>

                    <input
                        type="text"
                        id="judul"
                        required
                        placeholder="Judul informasi"
                    >

                </div>


                <div class="form-group">

                    <label for="kategori">
                        Kategori
                    </label>

                    <select
                        id="kategori"
                        required
                    >

                        <option value="">
                            -- Pilih Kategori --
                        </option>

                        <option value="Beranda">
                            Beranda
                        </option>

                        <option value="Profil Desa">
                            Profil Desa
                        </option>

                        <option value="Keindahan">
                            Keindahan
                        </option>

                        <option value="Kegiatan">
                            Kegiatan
                        </option>

                        <option value="Lokasi">
                            Lokasi
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="urlGambar">
                        URL Gambar
                    </label>

                    <input
                        type="url"
                        id="urlGambar"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group full">

                    <label for="deskripsi">
                        Deskripsi
                    </label>

                    <textarea
                        id="deskripsi"
                        required
                        placeholder="Tuliskan informasi desa..."
                    ></textarea>

                </div>

            </div>


            <div class="button-group">

                <button
                    type="submit"
                    class="save-button"
                    id="saveButton"
                >
                    💾 Simpan Data
                </button>

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelButton"
                    style="display:none;"
                >
                    ❌ Batal Edit
                </button>

            </div>

        </form>

    </section>


    <!-- DATA -->

    <section class="admin-card">

        <h2>
            📋 Data Desa
        </h2>

        <div id="dataList">

            <div class="loading">
                ⏳ Memuat data...
            </div>

        </div>

    </section>

</main>


<script src="config.js"></script>

<script>

const token =
    sessionStorage.getItem("desaAdminToken");

const WEB_URL =
    typeof WEB_APP_URL !== "undefined"
        ? WEB_APP_URL
        : "";


/* =====================================================
   CEK LOGIN
===================================================== */

if (!token) {

    window.location.href =
        "admin-login.html";

}


/* =====================================================
   ELEMENT
===================================================== */

const dataForm =
    document.getElementById("dataForm");

const dataList =
    document.getElementById("dataList");

const message =
    document.getElementById("message");

const saveButton =
    document.getElementById("saveButton");

const cancelButton =
    document.getElementById("cancelButton");

const formTitle =
    document.getElementById("formTitle");


let editingId = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(function() {

        message.className =
            "message";

    }, 4000);

}


/* =====================================================
   POST API
===================================================== */

async function apiPost(data) {

    const formData =
        new URLSearchParams();


    Object.keys(data).forEach(function(key) {

        formData.append(
            key,
            data[key] ?? ""
        );

    });


    const response =
        await fetch(
            WEB_URL,
            {
                method: "POST",
                body: formData
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " + response.status
        );

    }


    return await response.json();

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData() {

    dataList.innerHTML =
        '<div class="loading">⏳ Memuat data...</div>';


    try {

        const response =
            await fetch(
                WEB_URL +
                "?action=list"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal mengambil data."
            );

        }


        renderData(
            result.data || []
        );


    } catch (error) {

        console.error(
            "LOAD ERROR:",
            error
        );


        dataList.innerHTML = `
            <div class="message error">
                ❌ Gagal mengambil data dari database.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   RENDER DATA
===================================================== */

function renderData(data) {

    if (!data.length) {

        dataList.innerHTML =
            '<div class="empty">Belum ada data desa.</div>';

        return;

    }


    dataList.innerHTML = "";


    data.forEach(function(item) {

        /*
         * Code.gs menggunakan:
         * id
         * nama
         * judul
         * kategori
         * deskripsi
         * urlGambar
         * tanggal
         */


        const id =
            item.id ?? "";


        const nama =
            item.nama ?? "";


        const judul =
            item.judul ?? "";


        const kategori =
            item.kategori ?? "";


        const deskripsi =
            item.deskripsi ?? "";


        const urlGambar =
            item.urlGambar ?? "";


        const tanggal =
            item.tanggal ?? "";


        const div =
            document.createElement("div");


        div.className =
            "data-item";


        let imageHTML = "";


        if (urlGambar) {

            imageHTML = `
                <br>

                <img
                    src="${escapeHTML(urlGambar)}"
                    class="data-image"
                    alt="Gambar ${escapeHTML(judul)}"
                    onerror="this.style.display='none'"
                >
            `;

        }


        div.innerHTML = `

            <span class="data-category">
                ${escapeHTML(kategori || "-")}
            </span>

            <h3>
                ${escapeHTML(judul || "-")}
            </h3>

            <p>
                ${escapeHTML(deskripsi || "-")}
            </p>

            ${imageHTML}

            <p>
                <strong>👤 Pengisi:</strong>
                ${escapeHTML(nama || "-")}
            </p>

            <p>
                <strong>📅 Tanggal:</strong>
                ${formatTanggal(tanggal)}
            </p>

            <div class="data-actions">

                <button
                    class="edit-button"
                    onclick="editData('${escapeHTML(id)}')"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete-button"
                    onclick="deleteData('${escapeHTML(id)}')"
                >
                    🗑️ Hapus
                </button>

            </div>

        `;


        dataList.appendChild(div);

    });

}


/* =====================================================
   FORMAT TANGGAL
===================================================== */

function formatTanggal(tanggal) {

    if (!tanggal) {

        return "-";

    }


    const date =
        new Date(tanggal);


    if (isNaN(date.getTime())) {

        return escapeHTML(
            String(tanggal)
        );

    }


    return escapeHTML(
        date.toLocaleDateString(
            "id-ID",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        )
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FORM SUBMIT
===================================================== */

dataForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        saveButton.disabled =
            true;


        saveButton.textContent =
            "⏳ Menyimpan...";


        try {

            const payload = {

                action:
                    editingId
                        ? "update"
                        : "create",

                token:
                    token,

                id:
                    editingId || "",

                nama:
                    document
                        .getElementById("nama")
                        .value
                        .trim(),

                judul:
                    document
                        .getElementById("judul")
                        .value
                        .trim(),

                kategori:
                    document
                        .getElementById("kategori")
                        .value,

                deskripsi:
                    document
                        .getElementById("deskripsi")
                        .value
                        .trim(),

                urlGambar:
                    document
                        .getElementById("urlGambar")
                        .value
                        .trim()

            };


            const result =
                await apiPost(
                    payload
                );


            if (!result.success) {

                throw new Error(
                    result.message ||
                    "Gagal menyimpan data."
                );

            }


            showMessage(
                editingId
                    ? "Data berhasil diperbarui."
                    : "Data berhasil ditambahkan.",
                "success"
            );


            resetForm();


            await loadData();


        } catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Terjadi kesalahan.",
                "error"
            );

        }


        saveButton.disabled =
            false;


        saveButton.textContent =
            "💾 Simpan Data";

    }
);


/* =====================================================
   EDIT DATA
===================================================== */

async function editData(id) {

    try {

        const response =
            await fetch(
                WEB_URL +
                "?action=list"
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal mengambil data."
            );

        }


        const item =
            (result.data || []).find(
                function(data) {

                    return String(
                        data.id
                    ) === String(id);

                }
            );


        if (!item) {

            alert(
                "Data tidak ditemukan."
            );

            return;

        }


        editingId =
            item.id;


        document
            .getElementById("nama")
            .value =
            item.nama || "";


        document
            .getElementById("judul")
            .value =
            item.judul || "";


        document
            .getElementById("kategori")
            .value =
            item.kategori || "";


        document
            .getElementById("deskripsi")
            .value =
            item.deskripsi || "";


        document
            .getElementById("urlGambar")
            .value =
            item.urlGambar || "";


        formTitle.textContent =
            "✏️ Edit Data Desa";


        cancelButton.style.display =
            "inline-block";


        saveButton.textContent =
            "💾 Simpan Perubahan";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    } catch (error) {

        console.error(
            "EDIT ERROR:",
            error
        );


        showMessage(
            "Gagal mengambil data untuk diedit.",
            "error"
        );

    }

}


/* =====================================================
   DELETE DATA
===================================================== */

async function deleteData(id) {

    const yakin =
        confirm(
            "Apakah kamu yakin ingin menghapus data ini?"
        );


    if (!yakin) {

        return;

    }


    try {

        const result =
            await apiPost({

                action:
                    "delete",

                token:
                    token,

                id:
                    id

            });


        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal menghapus data."
            );

        }


        showMessage(
            "Data berhasil dihapus.",
            "success"
        );


        await loadData();


    } catch (error) {

        console.error(
            "DELETE ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Gagal menghapus data.",
            "error"
        );

    }

}


/* =====================================================
   BATAL EDIT
===================================================== */

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


/* =====================================================
   RESET FORM
===================================================== */

function resetForm() {

    editingId =
        null;


    dataForm.reset();


    formTitle.textContent =
        "➕ Tambah Data Desa";


    cancelButton.style.display =
        "none";


    saveButton.textContent =
        "💾 Simpan Data";

}


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async function() {

            try {

                await apiPost({

                    action:
                        "logout",

                    token:
                        token

                });

            } catch (error) {

                console.error(
                    error
                );

            }


            sessionStorage.removeItem(
                "desaAdminToken"
            );


            sessionStorage.removeItem(
                "desaAdminLogin"
            );


            window.location.href =
                "admin-login.html";

        }
    );


/* =====================================================
   MULAI
===================================================== */

loadData();

</script>

</body>
</html>
