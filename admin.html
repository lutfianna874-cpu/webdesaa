<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./logo.png?v=2"><title>Admin Pengaduan - Desa Sepinggan Gelik</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f6;color:#263238}
.header{background:#075e54;color:#fff;padding:25px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{margin:0;font-size:30px}.header p{margin:7px 0 0;opacity:.9}.header-buttons{display:flex;gap:8px;flex-wrap:wrap}.header a,.header button{border:0;background:#fff;color:#075e54;padding:11px 15px;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer}
.container{width:94%;max-width:1250px;margin:28px auto}.message{display:none;padding:13px 16px;border-radius:8px;margin-bottom:18px;font-weight:bold}.message.success{display:block;background:#dff5e9;color:#087f5b}.message.error{display:block;background:#fde4e4;color:#c62828}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 15px rgba(0,0,0,.08);margin-bottom:22px}.card h2{margin-top:0;color:#075e54}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:0;padding:9px 13px;border-radius:20px;background:#edf2f1;color:#075e54;font-weight:bold;cursor:pointer}.filters button.active{background:#075e54;color:#fff}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f3f7f6;color:#075e54}.status{display:inline-block;padding:5px 9px;border-radius:18px;font-weight:bold;font-size:12px}.s-menunggu{background:#fff3cd;color:#856404}.s-ditanggapi{background:#dff5e9;color:#087f5b}.s-ditolak{background:#fde4e4;color:#c62828}
textarea{width:100%;min-height:90px;padding:9px;border:1px solid #ccc;border-radius:7px;font-family:inherit;resize:vertical}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;padding:8px 10px;border-radius:7px;color:#fff;font-weight:bold;cursor:pointer}.reply{background:#087f5b}.reject{background:#c62828}.save{background:#075e54}.loading{text-align:center;padding:25px;color:#777}.small{font-size:12px;color:#777}
@media(max-width:700px){.header{flex-direction:column;align-items:flex-start}.container{width:96%}}
</style></head>
<body>
<header class="header"><div><h1>📢 Admin Pengaduan</h1><p>Desa Sepinggan Gelik</p></div><div class="header-buttons"><a href="index.html">🏠 Beranda</a><button onclick="logout()">🚪 Logout</button></div></header>
<main class="container"><div id="message" class="message"></div>
<section class="card"><h2>📊 Daftar Pengaduan Masyarakat</h2><div class="filters"><button class="active" onclick="setFilter('Semua',this)">Semua</button><button onclick="setFilter('Menunggu',this)">Menunggu</button><button onclick="setFilter('Ditanggapi',this)">Ditanggapi</button><button onclick="setFilter('Ditolak',this)">Ditolak</button></div></section>
<section class="card"><div id="dataList" class="loading">Memuat pengaduan...</div></section></main>
<script src="config.js"></script>
<script>
const API=typeof WEB_APP_URL!=="undefined"?WEB_APP_URL:"";const token=sessionStorage.getItem("desaAdminToken");let allData=[],filter="Semua";
if(!token) location.href="admin-login.html";
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
async function load(){const box=document.getElementById("dataList");box.innerHTML="<div class='loading'>Memuat pengaduan...</div>";try{const r=await fetch(API+"?action=listPengaduan&token="+encodeURIComponent(token));const x=await r.json();if(!x.success)throw new Error(x.message||"Gagal memuat data");allData=x.data||[];render()}catch(e){box.innerHTML="<div class='loading'>❌ "+esc(e.message)+"</div>"}}
function setFilter(f,b){filter=f;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function render(){let d=allData.filter(x=>filter==="Semua"||x.status===filter);if(!d.length){document.getElementById("dataList").innerHTML="<div class='loading'>Belum ada pengaduan.</div>";return}let h="<div class='table-wrap'><table><thead><tr><th>ID</th><th>Tanggal</th><th>Pelapor</th><th>Kategori</th><th>Judul & Isi</th><th>Status</th><th>Tanggapan / Aksi</th></tr></thead><tbody>";d.forEach(x=>{let c=x.status==="Ditanggapi"?"s-ditanggapi":x.status==="Ditolak"?"s-ditolak":"s-menunggu";h+=`<tr><td><strong>${esc(x.id)}</strong><br><span class="small">${esc(x.noHp)}</span></td><td>${esc(x.tanggal)}</td><td>${esc(x.nama)}</td><td>${esc(x.kategori)}</td><td><strong>${esc(x.judul)}</strong><br>${esc(x.isi)}</td><td><span class="status ${c}">${esc(x.status)}</span></td><td><textarea id="t_${esc(x.id)}" placeholder="Tulis tanggapan admin...">${esc(x.tanggapan)}</textarea><div class="actions"><button class="reply" onclick="updateStatus('${esc(x.id)}','Ditanggapi')">✅ Tanggapi</button><button class="reject" onclick="updateStatus('${esc(x.id)}','Ditolak')">❌ Tolak</button><button class="save" onclick="updateStatus('${esc(x.id)}','Menunggu')">💾 Simpan</button></div></td></tr>`});h+="</tbody></table></div>";document.getElementById("dataList").innerHTML=h}
async function updateStatus(id,status){const t=document.getElementById("t_"+id).value.trim();if(status==="Ditolak"&&!t){alert("Tuliskan alasan penolakan terlebih dahulu.");return}try{const p=new URLSearchParams({action:"updatePengaduan",token,id,status,tanggapan:t});const r=await fetch(API+"?"+p.toString());const x=await r.json();if(!x.success)throw new Error(x.message||"Gagal memperbarui");show("Pengaduan "+status.toLowerCase()+" berhasil.","success");await load()}catch(e){show(e.message,"error")}}
function show(t,c){const m=document.getElementById("message");m.textContent=t;m.className="message "+c}
async function logout(){try{await fetch(API+"?action=logout&token="+encodeURIComponent(token))}catch(e){}sessionStorage.clear();location.href="index.html"}
load();
</script></body></html>
