<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
       <link rel="icon" type="image/png" href="./logo.png?v=2">

<title>Admin Dashboard - Desa Sepinggan Gelik</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#263238;
}

/* HEADER */

.header{
    background:#075e54;
    color:white;
    padding:28px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.header h1{
    margin:0;
    font-size:32px;
}

.header p{
    margin:8px 0 0;
    opacity:.9;
}

.header-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.header a,
.header button{
    border:0;
    background:white;
    color:#075e54;
    padding:12px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

/* CONTAINER */

.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

/* PESAN */

.message{
    display:none;
    padding:15px 18px;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

.message.success{
    display:block;
    background:#dff5e9;
    color:#087f5b;
}

.message.error{
    display:block;
    background:#fde4e4;
    color:#c62828;
}

/* FORM */

.form-card{
    background:white;
    border-radius:14px;
    padding:28px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    margin-bottom:30px;
}

.form-card h2{
    margin-top:0;
    color:#075e54;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d6d6d6;
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#075e54;
}

/* BUTTON */

.form-buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.btn-primary{
    background:#075e54;
    color:white;
}

.btn-secondary{
    background:#e8eeee;
    color:#075e54;
}

.btn-edit{
    background:#f0a500;
    color:white;
}

.btn-delete{
    background:#c62828;
    color:white;
}

/* DATA */

.data-card{
    background:white;
    border-radius:14px;
    padding:28px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.data-card h2{
    margin-top:0;
    color:#075e54;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,
td{
    text-align:left;
    padding:13px;
    border-bottom:1px solid #eee;
    vertical-align:middle;
}

th{
    background:#f3f7f6;
    color:#075e54;
}

.data-image{
    width:80px;
    height:60px;
    object-fit:cover;
    border-radius:7px;
    background:#eee;
}

.action-buttons{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* MOBILE */

@media(max-width:700px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .header h1{
        font-size:25px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .container{
        width:94%;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div>

        <h1>🌿 Admin Dashboard</h1>

        <p>
            Desa Sepinggan Gelik
        </p>

    </div>


    <div class="header-buttons">

        <a href="index.html">
            🏠 Beranda
        </a>

        <button onclick="logout()">
            🚪 Logout
        </button>

    </div>

</header>



<!-- =====================================================
     CONTAINER
===================================================== -->

<main class="container">


    <div id="message"
         class="message">
    </div>



    <!-- =================================================
         FORM
    ================================================= -->

    <section class="form-card">

        <h2 id="formTitle">
            ➕ Tambah Data Desa
        </h2>


        <form id="dataForm">


            <input
                type="hidden"
                id="dataId"
            >


            <div class="form-grid">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="nama">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="nama"
                        required
                    >

                </div>



                <!-- JUDUL -->

                <div class="form-group">

                    <label for="judul">
                        Judul
                    </label>

                    <input
                        type="text"
                        id="judul"
                        required
                    >

                </div>



                <!-- KATEGORI -->

                <div class="form-group">

                    <label for="kategori">
                        Kategori
                    </label>

                    <select
                        id="kategori"
                        required
                    >

                        <option value="">
                            -- Pilih Kategori --
                        </option>

                        <option value="Beranda">
                            Beranda
                        </option>

                        <option value="Profil Desa">
                            Profil Desa
                        </option>

                        <option value="Keindahan">
                            Keindahan
                        </option>

                        <option value="Kegiatan">
                            Kegiatan
                        </option>

                        <option value="Lokasi">
                            Lokasi
                        </option>

                    </select>

                </div>



                <!-- TANGGAL -->

                <div class="form-group">

                    <label for="tanggal">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="tanggal"
                    >

                </div>



                <!-- DESKRIPSI -->

                <div class="form-group full">

                    <label for="deskripsi">
                        Deskripsi
                    </label>

                    <textarea
                        id="deskripsi"
                        placeholder="Tuliskan deskripsi..."
                    ></textarea>

                </div>



                <!-- GAMBAR -->

                <div class="form-group full">

                    <label for="urlGambar">
                        URL Gambar
                    </label>

                    <input
                        type="url"
                        id="urlGambar"
                        placeholder="https://..."
                    >

                </div>


            </div>



            <!-- BUTTON -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveButton"
                >
                    💾 Simpan Data
                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelButton"
                    onclick="resetForm()"
                    style="display:none;"
                >
                    ❌ Batal Edit
                </button>

            </div>


        </form>

    </section>



    <!-- =================================================
         DATA
    ================================================= -->

    <section class="data-card">

        <h2>
            📋 Data Desa
        </h2>


        <div id="dataList">

            <div class="loading">
                Memuat data...
            </div>

        </div>


    </section>


</main>



<script>

/* =====================================================
   URL GOOGLE APPS SCRIPT
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzN1j6Bhyy8_RZTvsK-aPzVNxKlG0JPtqLNzhJueziXDvt0isxag3VrTkiwtzxn1fU/exec";


/* =====================================================
   ELEMENT
===================================================== */

const dataForm =
    document.getElementById("dataForm");

const dataId =
    document.getElementById("dataId");

const nama =
    document.getElementById("nama");

const judul =
    document.getElementById("judul");

const kategori =
    document.getElementById("kategori");

const deskripsi =
    document.getElementById("deskripsi");

const urlGambar =
    document.getElementById("urlGambar");

const tanggal =
    document.getElementById("tanggal");

const dataList =
    document.getElementById("dataList");

const message =
    document.getElementById("message");

const formTitle =
    document.getElementById("formTitle");

const saveButton =
    document.getElementById("saveButton");

const cancelButton =
    document.getElementById("cancelButton");


/* =====================================================
   TOKEN
===================================================== */

let token =
    sessionStorage.getItem("desaAdminToken");


/* =====================================================
   CEK LOGIN
===================================================== */

if (!token) {

    window.location.href =
        "admin-login.html";

}


/* =====================================================
   PESAN
===================================================== */

function showMessage(text, type){

    message.textContent = text;

    message.className =
        "message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    dataList.innerHTML =
        '<div class="loading">Memuat data...</div>';

    try{

        const response =
            await fetch(
                WEB_APP_URL + "?action=list"
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const result =
            await response.json();

        if(
            !result ||
            result.success !== true
        ){

            throw new Error(
                result.message ||
                "Gagal mengambil data."
            );

        }

        renderData(result.data || []);

    }
    catch(error){

        dataList.innerHTML =
            '<div class="loading">' +
            'Gagal memuat data: ' +
            escapeHtml(error.message) +
            '</div>';

    }

}


/* =====================================================
   RENDER DATA
===================================================== */

function renderData(data){

    if(!data.length){

        dataList.innerHTML =
            '<div class="loading">' +
            'Belum ada data.' +
            '</div>';

        return;

    }


    let html = `

        <div class="table-wrapper">

        <table>

        <thead>

            <tr>

                <th>No</th>

                <th>Nama</th>

                <th>Judul</th>

                <th>Kategori</th>

                <th>Deskripsi</th>

                <th>Gambar</th>

                <th>Tanggal</th>

                <th>Aksi</th>

            </tr>

        </thead>

        <tbody>

    `;


    data.forEach(function(item,index){

        let image = "-";


        if(item.urlGambar){

            image = `

                <img
                    src="${escapeHtml(item.urlGambar)}"
                    class="data-image"
                    alt="Gambar"
                    onerror="this.style.display='none'"
                >

            `;

        }


        html += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(item.nama)}
                </td>

                <td>
                    ${escapeHtml(item.judul)}
                </td>

                <td>
                    ${escapeHtml(item.kategori)}
                </td>

                <td>
                    ${escapeHtml(item.deskripsi)}
                </td>

                <td>
                    ${image}
                </td>

                <td>
                    ${escapeHtml(item.tanggal)}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="btn btn-edit"
                            onclick='editData(${JSON.stringify(item)})'
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="btn btn-delete"
                            onclick="deleteData('${escapeHtml(item.id)}')"
                        >
                            🗑️ Hapus
                        </button>

                    </div>

                </td>

            </tr>

        `;

    });


    html += `

        </tbody>

        </table>

        </div>

    `;


    dataList.innerHTML = html;

}


/* =====================================================
   EDIT DATA
===================================================== */

function editData(item){

    dataId.value =
        item.id || "";

    nama.value =
        item.nama || "";

    judul.value =
        item.judul || "";

    kategori.value =
        item.kategori || "";

    deskripsi.value =
        item.deskripsi || "";

    urlGambar.value =
        item.urlGambar || "";

    tanggal.value =
        item.tanggal || "";


    formTitle.textContent =
        "✏️ Edit Data Desa";

    saveButton.textContent =
        "💾 Simpan Perubahan";

    cancelButton.style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   SUBMIT FORM
===================================================== */

dataForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const id =
            dataId.value.trim();


        const action =
            id ? "update" : "create";


        saveButton.disabled =
            true;

        saveButton.textContent =
            "⏳ Menyimpan...";


        try{

            const params =
                new URLSearchParams();


            params.set(
                "action",
                action
            );


            params.set(
                "token",
                token
            );


            if(id){

                params.set(
                    "id",
                    id
                );

            }


            params.set(
                "nama",
                nama.value
            );

            params.set(
                "judul",
                judul.value
            );

            params.set(
                "kategori",
                kategori.value
            );

            params.set(
                "deskripsi",
                deskripsi.value
            );

            params.set(
                "urlGambar",
                urlGambar.value
            );

            params.set(
                "tanggal",
                tanggal.value
            );


            const response =
                await fetch(
                    WEB_APP_URL +
                    "?" +
                    params.toString()
                );


            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            if(!result.success){

                throw new Error(
                    result.message ||
                    "Data gagal disimpan."
                );

            }


            showMessage(
                id
                ? "Data berhasil diperbarui."
                : "Data berhasil ditambahkan.",
                "success"
            );


            resetForm();

            await loadData();


        }
        catch(error){

            showMessage(
                "Gagal menyimpan data: " +
                error.message,
                "error"
            );

        }
        finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 Simpan Data";

        }

    }
);


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

    dataForm.reset();

    dataId.value = "";

    formTitle.textContent =
        "➕ Tambah Data Desa";

    saveButton.textContent =
        "💾 Simpan Data";

    cancelButton.style.display =
        "none";

}


/* =====================================================
   DELETE DATA
===================================================== */

async function deleteData(id){

    if(!confirm(
        "Apakah kamu yakin ingin menghapus data ini?"
    )){

        return;

    }


    try{

        const params =
            new URLSearchParams();

        params.set(
            "action",
            "delete"
        );

        params.set(
            "token",
            token
        );

        params.set(
            "id",
            id
        );


        const response =
            await fetch(
                WEB_APP_URL +
                "?" +
                params.toString()
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if(!result.success){

            throw new Error(
                result.message ||
                "Data gagal dihapus."
            );

        }


        showMessage(
            "Data berhasil dihapus.",
            "success"
        );


        await loadData();


    }
    catch(error){

        showMessage(
            "Gagal menghapus data: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    try{

        if(token){

            const params =
                new URLSearchParams();

            params.set(
                "action",
                "logout"
            );

            params.set(
                "token",
                token
            );

            await fetch(
                WEB_APP_URL +
                "?" +
                params.toString()
            );

        }

    }
    catch(error){

        console.log(error);

    }


    sessionStorage.removeItem(
        "desaAdminToken"
    );

    sessionStorage.removeItem(
        "desaAdminLogin"
    );


    window.location.href =
        "index.html";

}


/* =====================================================
   LOAD AWAL
===================================================== */

loadData();

</script>


</body>

</html>
