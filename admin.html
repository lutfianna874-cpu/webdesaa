<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Desa Sepinggan Gelik</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           ADMIN DASHBOARD
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8f3;
            color: #333;
        }

        .admin-header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .admin-header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .admin-title {
            margin: 0;
            font-size: 26px;
        }

        .admin-subtitle {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .admin-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            border: none;
            padding: 11px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn {
            background: white;
            color: #2e7d32;
        }

        .logout-btn {
            background: #c62828;
            color: white;
        }

        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .admin-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .admin-card h2 {
            margin-top: 0;
            color: #2e7d32;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .save-btn {
            background: #2e7d32;
            color: white;
        }

        .cancel-btn {
            background: #777;
            color: white;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status-message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status-success {
            display: block;
            background: #dff2df;
            color: #216b21;
        }

        .status-error {
            display: block;
            background: #fde0e0;
            color: #a51d1d;
        }

        .status-loading {
            display: block;
            background: #fff3cd;
            color: #856404;
        }

        /* =====================================================
           DATA
        ===================================================== */

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .data-header h2 {
            margin: 0;
        }

        .refresh-btn {
            background: #1976d2;
            color: white;
        }

        .data-list {
            display: grid;
            gap: 18px;
        }

        .data-item {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            background: #fafafa;
        }

        .data-item-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .data-item h3 {
            margin: 0;
            color: #2e7d32;
        }

        .category-badge {
            background: #2e7d32;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .data-info {
            margin: 7px 0;
            line-height: 1.5;
        }

        .data-info strong {
            color: #444;
        }

        .data-image {
            max-width: 220px;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        .data-actions {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-btn {
            background: #f9a825;
            color: white;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
        }

        .empty-data {
            text-align: center;
            padding: 35px 15px;
            color: #777;
        }

        .loading-data {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark {
            background: #121212;
            color: #eee;
        }

        body.dark .admin-card {
            background: #1e1e1e;
            color: #eee;
        }

        body.dark .data-item {
            background: #252525;
            border-color: #444;
        }

        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            background: #2b2b2b;
            color: white;
            border-color: #555;
        }

        body.dark .data-info strong {
            color: #ddd;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {

            .admin-header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .data-item-header {
                flex-direction: column;
            }

            .admin-container {
                padding: 0 12px;
            }

            .admin-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER ADMIN
    ===================================================== -->

    <header class="admin-header">

        <div class="admin-header-inner">

            <div>
                <h1 class="admin-title">
                    🌿 Admin Dashboard
                </h1>

                <p class="admin-subtitle">
                    Desa Sepinggan Gelik
                </p>
            </div>

            <div class="admin-buttons">

                <a href="index.html"
                   class="admin-btn home-btn">
                    🏠 Beranda
                </a>

                <button
                    type="button"
                    class="admin-btn logout-btn"
                    id="logoutBtn">
                    🚪 Logout
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTAINER
    ===================================================== -->

    <main class="admin-container">

        <!-- STATUS -->

        <div
            id="statusMessage"
            class="status-message">
        </div>


        <!-- =================================================
             FORM TAMBAH / EDIT
        ================================================= -->

        <section class="admin-card">

            <h2 id="formTitle">
                ➕ Tambah Data Desa
            </h2>

            <form id="dataForm">

                <!-- ID TERSEMBUNYI -->

                <input
                    type="hidden"
                    id="dataId"
                    value="">


                <div class="form-grid">

                    <!-- NAMA -->

                    <div class="form-group">

                        <label for="nama">
                            Nama
                        </label>

                        <input
                            type="text"
                            id="nama"
                            name="nama"
                            placeholder="Masukkan nama"
                            required>

                    </div>


                    <!-- JUDUL -->

                    <div class="form-group">

                        <label for="judul">
                            Judul
                        </label>

                        <input
                            type="text"
                            id="judul"
                            name="judul"
                            placeholder="Masukkan judul"
                            required>

                    </div>


                    <!-- KATEGORI -->

                    <div class="form-group">

                        <label for="kategori">
                            Kategori
                        </label>

                        <select
                            id="kategori"
                            name="kategori"
                            required>

                            <option value="">
                                -- Pilih Kategori --
                            </option>

                            <option value="Beranda">
                                Beranda
                            </option>

                            <option value="Profil Desa">
                                Profil Desa
                            </option>

                            <option value="Keindahan">
                                Keindahan
                            </option>

                            <option value="Kegiatan">
                                Kegiatan
                            </option>

                            <option value="Lokasi">
                                Lokasi
                            </option>

                        </select>

                    </div>


                    <!-- TANGGAL -->

                    <div class="form-group">

                        <label for="tanggal">
                            Tanggal
                        </label>

                        <input
                            type="date"
                            id="tanggal"
                            name="tanggal">

                    </div>


                    <!-- DESKRIPSI -->

                    <div class="form-group full">

                        <label for="deskripsi">
                            Deskripsi
                        </label>

                        <textarea
                            id="deskripsi"
                            name="deskripsi"
                            placeholder="Masukkan deskripsi"></textarea>

                    </div>


                    <!-- URL GAMBAR -->

                    <div class="form-group full">

                        <label for="urlGambar">
                            URL Gambar
                        </label>

                        <input
                            type="url"
                            id="urlGambar"
                            name="urlGambar"
                            placeholder="https://contoh.com/gambar.jpg">

                    </div>

                </div>


                <!-- FORM ACTION -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="admin-btn save-btn"
                        id="saveBtn">

                        💾 Simpan Data

                    </button>

                    <button
                        type="button"
                        class="admin-btn cancel-btn"
                        id="cancelBtn"
                        style="display:none;">

                        ❌ Batal Edit

                    </button>

                </div>

            </form>

        </section>


        <!-- =================================================
             DAFTAR DATA
        ================================================= -->

        <section class="admin-card">

            <div class="data-header">

                <h2>
                    📋 Data Desa
                </h2>

                <button
                    type="button"
                    class="admin-btn refresh-btn"
                    id="refreshBtn">

                    🔄 Muat Ulang

                </button>

            </div>


            <div
                id="dataList"
                class="data-list">

                <div class="loading-data">
                    Memuat data...
                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         CONFIG DATABASE
    ===================================================== -->

    <script src="config.js"></script>


    <!-- =====================================================
         SCRIPT ADMIN
    ===================================================== -->

    <script>

        /* =====================================================
           CEK CONFIG
        ===================================================== */

        const WEB_URL =
            typeof WEB_APP_URL !== "undefined"
                ? WEB_APP_URL
                : "";


        /* =====================================================
           ELEMENT
        ===================================================== */

        const dataForm =
            document.getElementById("dataForm");

        const dataId =
            document.getElementById("dataId");

        const nama =
            document.getElementById("nama");

        const judul =
            document.getElementById("judul");

        const kategori =
            document.getElementById("kategori");

        const deskripsi =
            document.getElementById("deskripsi");

        const urlGambar =
            document.getElementById("urlGambar");

        const tanggal =
            document.getElementById("tanggal");

        const dataList =
            document.getElementById("dataList");

        const statusMessage =
            document.getElementById("statusMessage");

        const formTitle =
            document.getElementById("formTitle");

        const saveBtn =
            document.getElementById("saveBtn");

        const cancelBtn =
            document.getElementById("cancelBtn");

        const refreshBtn =
            document.getElementById("refreshBtn");

        const logoutBtn =
            document.getElementById("logoutBtn");


        /* =====================================================
           TOKEN LOGIN
        ===================================================== */

        const token =
            sessionStorage.getItem("desaAdminToken");


        /* =====================================================
           JIKA BELUM LOGIN
        ===================================================== */

        if (!token) {

            window.location.href =
                "admin-login.html";

        }


        /* =====================================================
           STATUS MESSAGE
        ===================================================== */

        function showStatus(message, type) {

            statusMessage.textContent =
                message;

            statusMessage.className =
                "status-message";

            if (type === "success") {

                statusMessage.classList.add(
                    "status-success"
                );

            }

            else if (type === "error") {

                statusMessage.classList.add(
                    "status-error"
                );

            }

            else {

                statusMessage.classList.add(
                    "status-loading"
                );

            }

        }


        function hideStatus() {

            statusMessage.textContent = "";

            statusMessage.className =
                "status-message";

        }


        /* =====================================================
           API POST
        ===================================================== */

        async function apiPost(action, data = {}) {

            if (!WEB_URL) {

                throw new Error(
                    "WEB_APP_URL belum diatur di config.js"
                );

            }


            const params =
                new URLSearchParams();

            params.append(
                "action",
                action
            );


            if (token) {

                params.append(
                    "token",
                    token
                );

            }


            Object.keys(data).forEach(
                key => {

                    if (
                        data[key] !== undefined &&
                        data[key] !== null
                    ) {

                        params.append(
                            key,
                            data[key]
                        );

                    }

                }
            );


            const response =
                await fetch(
                    WEB_URL,
                    {
                        method: "POST",
                        body: params
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server mengembalikan error HTTP " +
                    response.status
                );

            }


            const result =
                await response.json();


            return result;

        }


        /* =====================================================
           LOAD DATA
        ===================================================== */

        async function loadData() {

            dataList.innerHTML = `
                <div class="loading-data">
                    ⏳ Memuat data dari database...
                </div>
            `;


            try {

                if (!WEB_URL) {

                    throw new Error(
                        "WEB_APP_URL belum tersedia."
                    );

                }


                const response =
                    await fetch(
                        WEB_URL +
                        "?action=list"
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP Error " +
                        response.status
                    );

                }


                const result =
                    await response.json();


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Gagal mengambil data."
                    );

                }


                const data =
                    Array.isArray(result.data)
                        ? result.data
                        : [];


                renderData(data);

            }

            catch (error) {

                console.error(
                    "LOAD DATA ERROR:",
                    error
                );


                dataList.innerHTML = `
                    <div class="empty-data">

                        ❌ Gagal memuat data.

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                        <br><br>

                        <button
                            class="admin-btn refresh-btn"
                            onclick="loadData()">

                            🔄 Coba Lagi

                        </button>

                    </div>
                `;

            }

        }


        /* =====================================================
           RENDER DATA
        ===================================================== */

        function renderData(data) {

            if (!data || data.length === 0) {

                dataList.innerHTML = `
                    <div class="empty-data">

                        📭 Belum ada data di database.

                    </div>
                `;

                return;

            }


            dataList.innerHTML =
                data.map(item => {

                    /*
                     * PENTING:
                     * Code.gs mengirim data dengan nama:
                     *
                     * id
                     * nama
                     * judul
                     * kategori
                     * deskripsi
                     * urlGambar
                     * tanggal
                     *
                     * Jadi JANGAN menggunakan:
                     * item.NAMA
                     * item.JUDUL
                     * dll.
                     */


                    const id =
                        item.id ?? "";

                    const namaData =
                        item.nama ?? "-";

                    const judulData =
                        item.judul ?? "-";

                    const kategoriData =
                        item.kategori ?? "-";

                    const deskripsiData =
                        item.deskripsi ?? "-";

                    const urlData =
                        item.urlGambar ?? "";

                    const tanggalData =
                        item.tanggal ?? "-";


                    let imageHTML = "";


                    if (urlData) {

                        imageHTML = `
                            <img
                                src="${escapeAttribute(urlData)}"
                                alt="${escapeAttribute(judulData)}"
                                class="data-image"
                                onerror="this.style.display='none';">
                        `;

                    }


                    return `

                        <article
                            class="data-item">

                            <div
                                class="data-item-header">

                                <h3>
                                    ${escapeHtml(
                                        judulData
                                    )}
                                </h3>

                                <span
                                    class="category-badge">

                                    ${escapeHtml(
                                        kategoriData
                                    )}

                                </span>

                            </div>


                            <div class="data-info">

                                <strong>
                                    Nama:
                                </strong>

                                ${escapeHtml(
                                    namaData
                                )}

                            </div>


                            <div class="data-info">

                                <strong>
                                    Deskripsi:
                                </strong>

                                ${escapeHtml(
                                    deskripsiData
                                )}

                            </div>


                            <div class="data-info">

                                <strong>
                                    Tanggal:
                                </strong>

                                ${escapeHtml(
                                    tanggalData
                                )}

                            </div>


                            ${
                                urlData
                                ? `
                                    <div class="data-info">

                                        <strong>
                                            Gambar:
                                        </strong>

                                        <br>

                                        <a
                                            href="${escapeAttribute(urlData)}"
                                            target="_blank"
                                            rel="noopener noreferrer">

                                            Lihat gambar

                                        </a>

                                        ${imageHTML}

                                    </div>
                                `
                                : ""
                            }


                            <div class="data-actions">

                                <button
                                    type="button"
                                    class="admin-btn edit-btn"
                                    onclick='editData(${JSON.stringify(item)})'>

                                    ✏️ Edit

                                </button>


                                <button
                                    type="button"
                                    class="admin-btn delete-btn"
                                    onclick='deleteData("${escapeJs(id)}")'>

                                    🗑️ Hapus

                                </button>

                            </div>

                        </article>

                    `;

                }).join("");

        }


        /* =====================================================
           EDIT DATA
        ===================================================== */

        function editData(item) {

            /*
             * Menggunakan camelCase sesuai Code.gs
             */

            dataId.value =
                item.id ?? "";

            nama.value =
                item.nama ?? "";

            judul.value =
                item.judul ?? "";

            kategori.value =
                item.kategori ?? "";

            deskripsi.value =
                item.deskripsi ?? "";

            urlGambar.value =
                item.urlGambar ?? "";

            tanggal.value =
                formatDateForInput(
                    item.tanggal
                );


            formTitle.textContent =
                "✏️ Edit Data Desa";

            saveBtn.textContent =
                "💾 Simpan Perubahan";

            cancelBtn.style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =====================================================
           CANCEL EDIT
        ===================================================== */

        cancelBtn.addEventListener(
            "click",
            resetForm
        );


        function resetForm() {

            dataForm.reset();

            dataId.value = "";

            formTitle.textContent =
                "➕ Tambah Data Desa";

            saveBtn.textContent =
                "💾 Simpan Data";

            cancelBtn.style.display =
                "none";

        }


        /* =====================================================
           SUBMIT FORM
        ===================================================== */

        dataForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const id =
                    dataId.value.trim();


                const data = {

                    nama:
                        nama.value.trim(),

                    judul:
                        judul.value.trim(),

                    kategori:
                        kategori.value.trim(),

                    deskripsi:
                        deskripsi.value.trim(),

                    urlGambar:
                        urlGambar.value.trim(),

                    tanggal:
                        tanggal.value.trim()

                };


                try {

                    saveBtn.disabled = true;

                    saveBtn.textContent =
                        "⏳ Menyimpan...";


                    showStatus(
                        "⏳ Menyimpan data...",
                        "loading"
                    );


                    let result;


                    if (id) {

                        /*
                         * EDIT
                         */

                        result =
                            await apiPost(
                                "update",
                                {
                                    id: id,
                                    ...data
                                }
                            );

                    }

                    else {

                        /*
                         * TAMBAH
                         */

                        result =
                            await apiPost(
                                "create",
                                data
                            );

                    }


                    if (!result.success) {

                        throw new Error(
                            result.message ||
                            "Data gagal disimpan."
                        );

                    }


                    showStatus(
                        result.message ||
                        "Data berhasil disimpan.",
                        "success"
                    );


                    resetForm();


                    await loadData();


                    setTimeout(
                        hideStatus,
                        3000
                    );

                }

                catch (error) {

                    console.error(
                        "SAVE ERROR:",
                        error
                    );


                    showStatus(
                        "❌ " +
                        error.message,
                        "error"
                    );

                }

                finally {

                    saveBtn.disabled =
                        false;

                    saveBtn.textContent =
                        dataId.value
                            ? "💾 Simpan Perubahan"
                            : "💾 Simpan Data";

                }

            }
        );


        /* =====================================================
           DELETE DATA
        ===================================================== */

        async function deleteData(id) {

            if (!id) {

                alert(
                    "ID data tidak ditemukan."
                );

                return;

            }


            const yakin =
                confirm(
                    "Apakah kamu yakin ingin menghapus data ini?"
                );


            if (!yakin) {

                return;

            }


            try {

                showStatus(
                    "⏳ Menghapus data...",
                    "loading"
                );


                const result =
                    await apiPost(
                        "delete",
                        {
                            id: id
                        }
                    );


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Data gagal dihapus."
                    );

                }


                showStatus(
                    result.message ||
                    "Data berhasil dihapus.",
                    "success"
                );


                await loadData();


                setTimeout(
                    hideStatus,
                    3000
                );

            }

            catch (error) {

                console.error(
                    "DELETE ERROR:",
                    error
                );


                showStatus(
                    "❌ " +
                    error.message,
                    "error"
                );

            }

        }


        /* =====================================================
           REFRESH
        ===================================================== */

        refreshBtn.addEventListener(
            "click",
            async function() {

                showStatus(
                    "⏳ Memuat ulang data...",
                    "loading"
                );

                await loadData();

                showStatus(
                    "✅ Data berhasil dimuat ulang.",
                    "success"
                );

                setTimeout(
                    hideStatus,
                    2000
                );

            }
        );


        /* =====================================================
           LOGOUT
        ===================================================== */

        logoutBtn.addEventListener(
            "click",
            async function() {

                const yakin =
                    confirm(
                        "Apakah kamu yakin ingin logout?"
                    );


                if (!yakin) {

                    return;

                }


                try {

                    /*
                     * Memberitahu server bahwa token logout.
                     */

                    await apiPost(
                        "logout"
                    );

                }

                catch (error) {

                    console.warn(
                        "Logout server:",
                        error
                    );

                }


                /*
                 * Hapus login dari browser.
                 */

                sessionStorage.removeItem(
                    "desaAdminToken"
                );

                sessionStorage.removeItem(
                    "desaAdminLogin"
                );


                /*
                 * Kembali ke BERANDA.
                 * Dari beranda nanti bisa klik
                 * LOGIN ADMIN lagi.
                 */

                window.location.href =
                    "index.html";

            }
        );


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================================
           ESCAPE ATTRIBUTE
        ===================================================== */

        function escapeAttribute(value) {

            return escapeHtml(value);

        }


        /* =====================================================
           ESCAPE JAVASCRIPT
        ===================================================== */

        function escapeJs(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /\\/g,
                    "\\\\"
                )
                .replace(
                    /"/g,
                    '\\"'
                )
                .replace(
                    /'/g,
                    "\\'"
                )
                .replace(
                    /\r/g,
                    "\\r"
                )
                .replace(
                    /\n/g,
                    "\\n"
                );

        }


        /* =====================================================
           FORMAT TANGGAL
        ===================================================== */

        function formatDateForInput(value) {

            if (!value) {

                return "";

            }


            /*
             * Jika sudah YYYY-MM-DD
             */

            if (
                /^\d{4}-\d{2}-\d{2}$/.test(
                    String(value)
                )
            ) {

                return String(value);

            }


            /*
             * Coba ubah dari format tanggal lain.
             */

            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            const year =
                date.getFullYear();

            const month =
                String(
                    date.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );

            const day =
                String(
                    date.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                "-" +
                month +
                "-" +
                day
            );

        }


        /* =====================================================
           MULAI
        ===================================================== */

        loadData();

    </script>
